name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: PHP ${{ matrix.php }} — Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, json, bcmath, openssl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for CI
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Check PHP syntax (all app files)
        run: find app config routes database -name "*.php" | xargs php -l -n 1

      - name: Run Laravel Pint (code style check)
        run: ./vendor/bin/pint --test

      - name: Validate route & config loading
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan config:clear
          php artisan route:clear
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Run tests
        run: php artisan test --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_KEY: ${{ env.APP_KEY }}
